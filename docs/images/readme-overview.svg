<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1600 900" role="img" aria-labelledby="title desc">
  <title id="title">Spring Todo API ownership flow</title>
  <desc id="desc">An authenticated Spring Boot todo request flows from an OIDC principal through owner-scoped REST endpoints to PostgreSQL and Redis, with Flyway managing schema changes.</desc>
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#10233d"/>
      <stop offset="1" stop-color="#1c4261"/>
    </linearGradient>
    <linearGradient id="sky" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#79d7ee"/>
      <stop offset="1" stop-color="#b1f0ed"/>
    </linearGradient>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="16" stdDeviation="18" flood-color="#081525" flood-opacity=".4"/>
    </filter>
  </defs>
  <rect width="1600" height="900" rx="42" fill="url(#bg)"/>
  <circle cx="1450" cy="130" r="240" fill="#79d7ee" opacity=".08"/>
  <circle cx="80" cy="810" r="235" fill="#f6cb72" opacity=".07"/>
  <text x="100" y="112" fill="#79d7ee" font-family="Inter,Segoe UI,sans-serif" font-size="24" font-weight="700" letter-spacing="4">SPRING TODO API</text>
  <text x="100" y="195" fill="#f2fbff" font-family="Inter,Segoe UI,sans-serif" font-size="64" font-weight="800">A small API with</text>
  <text x="100" y="266" fill="#f2fbff" font-family="Inter,Segoe UI,sans-serif" font-size="64" font-weight="800">real ownership boundaries.</text>
  <text x="100" y="325" fill="#b1cfe1" font-family="Inter,Segoe UI,sans-serif" font-size="28">Auth0/OIDC · Spring Boot · PostgreSQL · Redis · Flyway</text>

  <path d="M390 540H510" stroke="#79d7ee" stroke-width="5" stroke-linecap="round"/>
  <path d="m498 526 20 14-20 14" fill="none" stroke="#79d7ee" stroke-width="5" stroke-linecap="round" stroke-linejoin="round"/>
  <path d="M940 540H1060" stroke="#79d7ee" stroke-width="5" stroke-linecap="round"/>
  <path d="m1048 526 20 14-20 14" fill="none" stroke="#79d7ee" stroke-width="5" stroke-linecap="round" stroke-linejoin="round"/>
  <g filter="url(#shadow)">
    <rect x="100" y="405" width="290" height="270" rx="26" fill="#173552" stroke="#386381" stroke-width="2"/>
    <rect x="515" y="405" width="425" height="270" rx="26" fill="#173552" stroke="#386381" stroke-width="2"/>
    <rect x="1065" y="405" width="435" height="270" rx="26" fill="#1d4a62" stroke="#79d7ee" stroke-width="2"/>
  </g>
  <text x="136" y="457" fill="#f6cb72" font-family="Inter,Segoe UI,sans-serif" font-size="21" font-weight="800" letter-spacing="2">01 / IDENTITY</text>
  <text x="136" y="515" fill="#f2fbff" font-family="Inter,Segoe UI,sans-serif" font-size="31" font-weight="700">OIDC principal</text>
  <text x="136" y="565" fill="#b1cfe1" font-family="Inter,Segoe UI,sans-serif" font-size="23">Auth0 validates who is</text>
  <text x="136" y="599" fill="#b1cfe1" font-family="Inter,Segoe UI,sans-serif" font-size="23">making the request.</text>
  <text x="136" y="641" fill="#79d7ee" font-family="ui-monospace,Menlo,monospace" font-size="19">authenticated session</text>

  <text x="551" y="457" fill="#f6cb72" font-family="Inter,Segoe UI,sans-serif" font-size="21" font-weight="800" letter-spacing="2">02 / REST CONTRACT</text>
  <text x="551" y="515" fill="#f2fbff" font-family="Inter,Segoe UI,sans-serif" font-size="31" font-weight="700">Owner-scoped todos</text>
  <text x="551" y="565" fill="#b1cfe1" font-family="Inter,Segoe UI,sans-serif" font-size="23">Create, read, update, and delete</text>
  <text x="551" y="599" fill="#b1cfe1" font-family="Inter,Segoe UI,sans-serif" font-size="23">only within the caller's boundary.</text>
  <text x="551" y="641" fill="#79d7ee" font-family="ui-monospace,Menlo,monospace" font-size="19">GET /todos · POST /todos</text>

  <text x="1101" y="457" fill="#b1f0ed" font-family="Inter,Segoe UI,sans-serif" font-size="21" font-weight="800" letter-spacing="2">03 / DATA LAYER</text>
  <text x="1101" y="515" fill="#f2fbff" font-family="Inter,Segoe UI,sans-serif" font-size="31" font-weight="700">Durable + quick</text>
  <text x="1101" y="565" fill="#d5f2f3" font-family="Inter,Segoe UI,sans-serif" font-size="23">PostgreSQL stores records; Redis</text>
  <text x="1101" y="599" fill="#d5f2f3" font-family="Inter,Segoe UI,sans-serif" font-size="23">caches individual reads.</text>
  <rect x="1101" y="620" width="250" height="36" rx="18" fill="#79d7ee" opacity=".16"/>
  <text x="1121" y="645" fill="#b1f0ed" font-family="ui-monospace,Menlo,monospace" font-size="19">Flyway owns schema</text>

  <text x="100" y="790" fill="#8db6ca" font-family="Inter,Segoe UI,sans-serif" font-size="22">The ownership test is the feature: another user should not see your todo.</text>
  <circle cx="1430" cy="785" r="9" fill="#79d7ee"/>
  <circle cx="1462" cy="785" r="9" fill="#f6cb72"/>
  <circle cx="1494" cy="785" r="9" fill="#f2fbff" opacity=".8"/>
</svg>
