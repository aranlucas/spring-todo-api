spring:
  application:
    name: spring-todo-api
  config:
    import: optional:file:./dev.properties
  datasource:
    url: ${SPRING_DATASOURCE_URL}
    username: ${SPRING_DATASOURCE_USERNAME:${PGUSER}}
    password: ${SPRING_DATASOURCE_PASSWORD:${PGPASSWORD}}
  flyway:
    baseline-on-migrate: true
    baseline-version: 1
  jpa:
    open-in-view: false
    hibernate:
      ddl-auto: validate
  cache:
    type: redis
    redis:
      time-to-live: 10m
  data:
    web:
      pageable:
        default-page-size: 20
        max-page-size: 100
    redis:
      url: ${REDIS_URL:${REDIS_DATASOURCE_URL}}
  security:
    oauth2:
      client:
        registration:
          auth0:
            provider: auth0
            client-id: ${AUTH0_CLIENT_ID}
            client-secret: ${AUTH0_CLIENT_SECRET}
            scope:
              - openid
              - profile
              - email
        provider:
          auth0:
            issuer-uri: ${AUTH0_ISSUER_URI}

springdoc:
  swagger-ui:
    path: /swagger-ui.html

management:
  endpoints:
    web:
      exposure:
        include: health,info
  endpoint:
    health:
      probes:
        enabled: true
      show-details: never
  info:
    env:
      enabled: false

server:
  port: ${PORT:8080}
  forward-headers-strategy: framework
  shutdown: graceful

logging:
  level:
    root: INFO
