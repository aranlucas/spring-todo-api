name: CI

on:
  workflow_dispatch:
  push:
    branches: [main]
  pull_request:
    types: [opened, synchronize, reopened, ready_for_review]

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  ci:
    if: ${{ github.event.pull_request.draft != true }}
    runs-on: ubuntu-latest
    timeout-minutes: 15
    services:
      postgres:
        image: postgres:17
        env:
          POSTGRES_DB: todo_test
          POSTGRES_USER: todo_test
          POSTGRES_PASSWORD: ci-test-only
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U todo_test -d todo_test"
          --health-interval 10s --health-timeout 5s --health-retries 5
      redis:
        image: redis:7
        ports:
          - 6379:6379
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 10s --health-timeout 5s --health-retries 5
    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          fetch-depth: 0

      - name: Set up Java
        uses: actions/setup-java@77dd5b2ce225ea11469928ac317850245a74ae78 # v6.2.0
        with:
          distribution: temurin
          java-version: '21'

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@8da46b539cd8fe6ab27ca75128919a18d757604c # v6.4.1

      - name: Lint, test, and package
        run: ./gradlew check bootJar

      - name: Verify HTTP contracts with PostgreSQL and Redis
        env:
          TEST_DATABASE_URL: jdbc:postgresql://localhost:5432/todo_test
          TEST_DATABASE_USERNAME: todo_test
          TEST_DATABASE_PASSWORD: ci-test-only
          TEST_CACHE_TYPE: redis
          TEST_REDIS_URL: redis://localhost:6379/15
        run: ./gradlew test --tests '*TodosHttpIntegrationTests' --rerun-tasks

      - name: Preserve test evidence
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: test-results
          path: |
            build/reports/tests/
            build/test-results/

      - name: Prove regressions fail against the audit baseline
        env:
          TEST_DATABASE_URL: jdbc:postgresql://localhost:5432/todo_test
          TEST_DATABASE_USERNAME: todo_test
          TEST_DATABASE_PASSWORD: ci-test-only
          TEST_CACHE_TYPE: redis
          TEST_REDIS_URL: redis://localhost:6379/15
        run: |
          git show 844e3041f31d8f1e4004e0b906c9b04cd438ef94:src/main/java/com/aranlucas/todo/config/CacheConfig.java > src/main/java/com/aranlucas/todo/config/CacheConfig.java
          git show 844e3041f31d8f1e4004e0b906c9b04cd438ef94:src/main/java/com/aranlucas/todo/todo/TodosController.java > src/main/java/com/aranlucas/todo/todo/TodosController.java
          if ./gradlew test --tests '*TodosHttpIntegrationTests.rejectsUnknownSortProperties' --tests '*TodosHttpIntegrationTests.rejectsUnusableOwnerClaims' --tests '*TodosHttpIntegrationTests.rolledBackCreationCannotBeReadFromCache' --rerun-tasks; then
            echo 'Expected the baseline to fail all regression behaviors'
            exit 1
          fi
          python3 - <<'PYTHON'
          import xml.etree.ElementTree as ET
          root = ET.parse('build/test-results/test/TEST-com.aranlucas.todo.todo.TodosHttpIntegrationTests.xml').getroot()
          expected = {
              'rejectsUnknownSortProperties': (1, "No property 'doesNotExist' found for type 'Todo'"),
              'rejectsUnusableOwnerClaims': (4, 'Status expected:<403> but was:<200>'),
              'rolledBackCreationCannotBeReadFromCache': (1, 'Status expected:<404> but was:<200>'),
          }
          for behavior, (count, message) in expected.items():
              cases = [case for case in root.findall('testcase') if case.attrib['name'].startswith(behavior)]
              assert len(cases) == count, (behavior, len(cases))
              for case in cases:
                  failure = case.find('failure')
                  assert failure is not None and message in failure.attrib.get('message', ''), behavior
          PYTHON

      - name: Preserve baseline regression evidence
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: baseline-regression-results
          path: |
            build/reports/tests/
            build/test-results/
